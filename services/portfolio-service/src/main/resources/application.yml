spring:
  application:
    name: portfolio-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/marketpulse}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true

server:
  port: 8081

user-service:
  url: ${USER_SERVICE_URL:http://localhost:8082}